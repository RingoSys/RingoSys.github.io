<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="Ringo 的个人博客，分享技术心得、学习笔记、学术思考和生活随笔。">
  <meta name="theme-color" content="#f8f7f4">
  <title>Ringo 的个人博客</title>
  <link rel="icon" href="./assets/mark.svg" type="image/svg+xml">
  <link rel="stylesheet" href="./css/style.css">
  <script src="./js/site.js" type="module"></script>
</head>
<body>
  <a class="skip-link" href="#articles">跳到文章</a>
  <header class="site-header">
    <div class="container header-inner">
      <a href="./" class="site-brand" aria-label="Ringo 的个人博客首页">
        <span class="brand-mark" aria-hidden="true">R</span>
        <span class="brand-name">Ringo<span>.</span></span>
      </a>
      <nav class="site-nav" aria-label="主导航">
        <a href="./" data-nav-category="all" aria-current="page">首页</a>
        <a href="?category=tech#articles" data-nav-category="tech">技术</a>
        <a href="?category=learning#articles" data-nav-category="learning">学习</a>
        <a href="?category=research#articles" data-nav-category="research">学术</a>
        <a href="?category=life#articles" data-nav-category="life">生活</a>
      </nav>
      <div class="header-tools">
        <a class="github-link" href="https://github.com/RingoSys" aria-label="RingoSys 的 GitHub 主页">
          <svg aria-hidden="true"><use href="./assets/icons.svg#github"></use></svg>
          <span>GitHub</span>
        </a>
      </div>
    </div>
  </header>

  <main class="container main-content">
    <section class="hero" aria-labelledby="hero-title">
      <img class="hero-image" src="./assets/mountain-journal.webp" alt="" width="1774" height="887" fetchpriority="high">
      <div class="hero-copy">
        <p class="hero-kicker"><span aria-hidden="true"></span> 你好，我是 Ringo</p>
        <h1 id="hero-title">把思考写下来<span>。</span></h1>
        <p class="hero-description">这里有我的技术心得、学习笔记、学术思考，<br class="hero-line-break">还有一些关于日常的记录。</p>
        <a class="hero-link" href="#articles">
          <svg aria-hidden="true"><use href="./assets/icons.svg#book"></use></svg>
          浏览文章
        </a>
      </div>
    </section>

    <section id="articles" class="archive" aria-labelledby="archive-title">
      <div class="archive-heading">
        <div>
          <h2 id="archive-title">文章档案</h2>
          <p id="article-count" class="article-count" aria-live="polite"></p>
        </div>
        <label class="search-box">
          <svg aria-hidden="true"><use href="./assets/icons.svg#search"></use></svg>
          <span class="visually-hidden">搜索文章</span>
          <input id="article-search" type="search" placeholder="搜索标题、摘要或标签" autocomplete="off">
        </label>
      </div>
      <div class="archive-toolbar">
        <div id="category-filters" class="category-filters" role="group" aria-label="按分类筛选">
          <button type="button" data-category="all" aria-pressed="true">全部文章</button>
          <button type="button" data-category="tech" aria-pressed="false">技术心得</button>
          <button type="button" data-category="learning" aria-pressed="false">学习笔记</button>
          <button type="button" data-category="research" aria-pressed="false">学术分享</button>
          <button type="button" data-category="life" aria-pressed="false">生活随笔</button>
        </div>
        <label class="sort-box">
          <svg class="sort-icon" aria-hidden="true"><use href="./assets/icons.svg#sort"></use></svg>
          <span class="visually-hidden">文章排序</span>
          <select id="article-sort">
            <option value="newest">最新发布</option>
            <option value="oldest">最早发布</option>
          </select>
          <svg class="sort-chevron" aria-hidden="true"><use href="./assets/icons.svg#chevron"></use></svg>
        </label>
      </div>
      <p id="archive-message" class="archive-message" role="status">正在加载文章…</p>
      <noscript><p class="archive-message">请启用 JavaScript 查看文章目录。</p></noscript>
      <div id="article-grid" class="article-grid"></div>
      <nav id="pagination" class="pagination" aria-label="文章分页" hidden></nav>
    </section>
  </main>

  <footer class="site-footer">
    <div class="container footer-inner">
      <a href="./" class="footer-brand">Ringo<span>.</span> 的个人博客</a>
      <span>技术 · 学习 · 学术 · 生活</span>
    </div>
  </footer>
</body>
</html>
