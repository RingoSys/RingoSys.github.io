<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="Notes on technology, learning, competitive programming, research, and life by RingoSys.">
  <meta name="theme-color" content="#f8f7f4">
  <title>RingoSys Blog</title>
  <link rel="icon" href="./assets/mark.svg" type="image/svg+xml">
  <link rel="stylesheet" href="./css/style.css?v={{SITE_CSS_VERSION}}">
  <script src="./js/site.js?v={{SITE_JS_VERSION}}" type="module"></script>
</head>
<body>
  <a class="skip-link" href="#articles">Skip to posts</a>
  <header class="site-header">
    <div class="container header-inner">
      <a href="./" class="site-brand" aria-label="RingoSys Blog home">
        <span class="brand-mark" aria-hidden="true">R</span>
        <span class="brand-name">RingoSys</span>
      </a>
      <nav class="site-nav" aria-label="Main navigation">
        <a href="./" data-nav-category="all" aria-current="page">Home</a>
        <a href="?category=tech#articles" data-nav-category="tech">Tech</a>
        <a href="?category=learning#articles" data-nav-category="learning">Learning</a>
        <a href="?category=algorithm#articles" data-nav-category="algorithm">Algorithms</a>
        <a href="?category=research#articles" data-nav-category="research">Research</a>
        <a href="?category=life#articles" data-nav-category="life">Life</a>
      </nav>
      <div class="header-tools">
        <a class="github-link" href="https://github.com/RingoSys" aria-label="RingoSys on GitHub">
          <svg aria-hidden="true"><use href="./assets/icons.svg#github"></use></svg>
          <span>GitHub</span>
        </a>
      </div>
    </div>
  </header>

  <main class="container main-content home-layout">
    <aside class="home-sidebar" aria-label="Blog information and categories">
      <section class="profile-card" aria-labelledby="profile-title">
        <img class="profile-cover" src="./assets/mountain-journal.webp" alt="" width="1774" height="887">
        <div class="profile-content">
          <span class="profile-mark" aria-hidden="true">R</span>
          <div>
            <h1 id="profile-title">RingoSys</h1>
            <p lang="zh-CN">没有结果也能尽兴</p>
          </div>
        </div>
      </section>

      <section class="category-card" aria-labelledby="categories-title">
        <h2 id="categories-title">Categories</h2>
        <div id="category-filters" class="category-filters" role="group" aria-labelledby="categories-title">
          <button type="button" data-category="all" aria-pressed="true">All posts<span class="category-count" aria-hidden="true"></span></button>
          <button type="button" data-category="tech" aria-pressed="false">Tech<span class="category-count" aria-hidden="true"></span></button>
          <button type="button" data-category="learning" aria-pressed="false">Learning<span class="category-count" aria-hidden="true"></span></button>
          <button type="button" data-category="algorithm" aria-pressed="false">Algorithms<span class="category-count" aria-hidden="true"></span></button>
          <button type="button" data-category="research" aria-pressed="false">Research<span class="category-count" aria-hidden="true"></span></button>
          <button type="button" data-category="life" aria-pressed="false">Life<span class="category-count" aria-hidden="true"></span></button>
        </div>
      </section>
    </aside>

    <section id="articles" class="archive" aria-labelledby="archive-title">
      <div class="archive-heading">
        <div>
          <h2 id="archive-title">Posts</h2>
          <p id="article-count" class="article-count" aria-live="polite"></p>
        </div>
        <div class="archive-controls">
          <label class="search-box">
            <svg aria-hidden="true"><use href="./assets/icons.svg#search"></use></svg>
            <span class="visually-hidden">Search titles, summaries, or tags</span>
            <input id="article-search" type="search" placeholder="Search posts" autocomplete="off">
          </label>
          <label class="sort-box">
            <svg class="sort-icon" aria-hidden="true"><use href="./assets/icons.svg#sort"></use></svg>
            <span class="visually-hidden">Sort posts</span>
            <select id="article-sort">
              <option value="newest">Newest first</option>
              <option value="oldest">Oldest first</option>
            </select>
            <svg class="sort-chevron" aria-hidden="true"><use href="./assets/icons.svg#chevron"></use></svg>
          </label>
        </div>
      </div>
      <p id="archive-message" class="archive-message" role="status">Loading posts…</p>
      <noscript><p class="archive-message">Enable JavaScript to view the post list.</p></noscript>
      <div id="article-grid" class="article-grid"></div>
      <nav id="pagination" class="pagination" aria-label="Post pages" hidden></nav>
    </section>
  </main>

  <footer class="site-footer">
    <div class="container footer-inner">
      <a href="./" class="footer-brand">RingoSys Blog</a>
      <span>Tech · Learning · Algorithms · Research · Life</span>
    </div>
  </footer>
  <script id="post-index" type="application/json">{{POST_INDEX}}</script>
</body>
</html>
